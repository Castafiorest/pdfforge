# PDFForge — nginx site config (template). @REPO@ replaced by install.sh.
# Serves the built frontend and proxies /api to the FastAPI server.

server {
    listen 80;
    server_name _;

    root @REPO@/apps/web/dist;
    index index.html;

    # Uploads up to MAX_FILE_SIZE_MB (must match pdfforge.env).
    client_max_body_size 40m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA fallback so /tools/* routes work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
