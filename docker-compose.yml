# PDFForge — Docker Compose
# One command:  docker compose up -d   →  http://localhost:3000

services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////data/pdfforge.db
      TEMP_DIR: /tmp/pdfforge
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-100}
      MAX_PAGES: ${MAX_PAGES:-500}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      JOB_TTL_MINUTES: ${JOB_TTL_MINUTES:-30}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_JOBS_PER_HOUR: ${RATE_LIMIT_JOBS_PER_HOUR:-10}
      CORS_ORIGINS: ${PUBLIC_URL:-http://localhost:3000}
    volumes:
      - pdfforge_data:/data
    restart: unless-stopped
    expose:
      - "8000"
    # Resource limits — heavy PDF jobs must never starve the host.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["python", "-m", "app.workers.worker"]
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////data/pdfforge.db
      TEMP_DIR: /tmp/pdfforge
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-100}
      MAX_PAGES: ${MAX_PAGES:-500}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
      JOB_TTL_MINUTES: ${JOB_TTL_MINUTES:-30}
    volumes:
      - pdfforge_data:/data
    depends_on:
      - api
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1g

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pdfforge_data:
